<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A prompt becoming a composition, rendered as sample frames, checked in a loop back to the composition before shipping">
  <rect width="1200" height="800" fill="#0a0908"/>
  <g stroke="#211d1b" stroke-width="1">
    <path d="M0 200h1200M0 400h1200M0 600h1200M400 0v800M800 0v800"/>
  </g>

  <!-- prompt -->
  <rect x="70" y="350" width="140" height="100" fill="#121010" stroke="#2b2624"/>
  <g fill="#4a423e">
    <rect x="90" y="375" width="100" height="7"/>
    <rect x="90" y="393" width="70" height="7"/>
    <rect x="90" y="411" width="85" height="7"/>
  </g>
  <text x="70" y="472" font-family="monospace" font-size="14" fill="#6d635e" letter-spacing="2">PROMPT</text>

  <path d="M212 400 L298 400" stroke="#f472b6" stroke-width="2" fill="none"/>
  <path d="M290 393 L300 400 L290 407" stroke="#f472b6" stroke-width="2" fill="none"/>

  <!-- composition (json) -->
  <rect x="300" y="330" width="150" height="140" fill="#151212" stroke="#f472b6" stroke-width="1.5"/>
  <text x="335" y="418" font-family="monospace" font-size="42" fill="#f472b6">{ }</text>
  <text x="300" y="492" font-family="monospace" font-size="14" fill="#6d635e" letter-spacing="2">COMPOSITION</text>

  <path d="M452 400 L548 400" stroke="#f472b6" stroke-width="2" fill="none"/>
  <path d="M540 393 L550 400 L540 407" stroke="#f472b6" stroke-width="2" fill="none"/>

  <!-- three sample frames -->
  <rect x="560" y="260" width="110" height="76" fill="#121010" stroke="#2b2624"/>
  <rect x="560" y="362" width="110" height="76" fill="#121010" stroke="#2b2624"/>
  <rect x="560" y="464" width="110" height="76" fill="#121010" stroke="#2b2624"/>
  <text x="560" y="562" font-family="monospace" font-size="13" fill="#6d635e" letter-spacing="2">SAMPLE FRAMES</text>

  <!-- check mark, dashed, over the frames -->
  <circle cx="740" cy="400" r="34" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 7"/>
  <text x="712" y="407" font-family="monospace" font-size="16" fill="#f472b6">?</text>

  <!-- loop back to composition -->
  <path d="M740 366 C 700 260, 500 250, 380 328" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65"/>
  <path d="M390 322 L378 328 L386 340" stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.65"/>
  <text x="520" y="240" font-family="monospace" font-size="13" fill="#6d635e" letter-spacing="2">REVISE</text>

  <!-- forward to output -->
  <path d="M786 400 L950 400" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M940 393 L952 400 L940 407" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.85"/>

  <rect x="960" y="345" width="170" height="110" fill="#171412" stroke="#2b2624"/>
  <text x="980" y="410" font-family="monospace" font-size="20" fill="#faeada" letter-spacing="1">SHIP?</text>

  <g font-family="monospace" font-size="15" fill="#6d635e" letter-spacing="3">
    <text x="70" y="740">GENERATE</text>
    <text x="960" y="740">CONFIDENCE UNDECIDED</text>
  </g>
</svg>
