<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A composition file splitting unevenly across three servers of different sizes, recombined by an orchestrator into one output">
  <rect width="1200" height="800" fill="#0a0908"/>
  <g stroke="#211d1b" stroke-width="1">
    <path d="M0 200h1200M0 400h1200M0 600h1200M400 0v800M800 0v800"/>
  </g>

  <!-- composition file -->
  <rect x="80" y="330" width="130" height="140" fill="#121010" stroke="#2b2624"/>
  <path d="M80 330 L180 330 L210 360 L210 470 L80 470 Z" fill="none" stroke="#2b2624"/>
  <path d="M180 330 L180 360 L210 360" fill="none" stroke="#2b2624"/>
  <g fill="#4a423e">
    <rect x="100" y="380" width="90" height="7"/>
    <rect x="100" y="400" width="70" height="7"/>
    <rect x="100" y="420" width="80" height="7"/>
  </g>
  <text x="80" y="500" font-family="monospace" font-size="14" fill="#6d635e" letter-spacing="2">COMPOSITION</text>

  <!-- fan out, uneven thickness = uneven cost -->
  <g fill="none" stroke="#4fd1c5">
    <path d="M240 400 C 340 400, 380 200, 500 190" stroke-width="2" opacity="0.7"/>
    <path d="M240 400 L500 400" stroke-width="4" opacity="0.8"/>
    <path d="M240 400 C 340 400, 380 600, 500 610" stroke-width="7" opacity="0.9"/>
  </g>

  <!-- cost marker -->
  <circle cx="360" cy="400" r="22" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="336" y="446" font-family="monospace" font-size="14" fill="#4fd1c5" letter-spacing="1">COST?</text>

  <!-- three machines, sized to the line feeding them -->
  <rect x="500" y="150" width="130" height="70" fill="#121010" stroke="#2b2624"/>
  <rect x="516" y="168" width="98" height="6" fill="#3a3330"/>
  <rect x="516" y="182" width="60" height="6" fill="#3a3330"/>

  <rect x="500" y="345" width="150" height="110" fill="#151212" stroke="#4fd1c5" stroke-width="1.5"/>
  <rect x="518" y="368" width="114" height="7" fill="#6d635e"/>
  <rect x="518" y="386" width="80" height="7" fill="#6d635e"/>
  <rect x="518" y="404" width="100" height="7" fill="#6d635e"/>

  <rect x="500" y="545" width="180" height="130" fill="#171412" stroke="#4fd1c5" stroke-width="2"/>
  <rect x="522" y="572" width="136" height="8" fill="#faeada" opacity="0.8"/>
  <rect x="522" y="594" width="100" height="8" fill="#faeada" opacity="0.6"/>
  <rect x="522" y="616" width="120" height="8" fill="#faeada" opacity="0.6"/>
  <rect x="522" y="638" width="70" height="8" fill="#faeada" opacity="0.4"/>

  <!-- converge to orchestrator -->
  <g fill="none" stroke="#4fd1c5" opacity="0.6">
    <path d="M630 185 C 760 185, 800 400, 900 400" stroke-width="2"/>
    <path d="M650 400 L900 400" stroke-width="3"/>
    <path d="M680 610 C 800 610, 820 400, 900 400" stroke-width="4"/>
  </g>
  <circle cx="900" cy="400" r="12" fill="#4fd1c5"/>
  <text x="856" y="440" font-family="monospace" font-size="13" fill="#6d635e" letter-spacing="2">ORCHESTRATOR</text>

  <!-- stitched output -->
  <rect x="960" y="365" width="160" height="70" fill="#121010" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="978" y="406" font-family="monospace" font-size="16" fill="#faeada" letter-spacing="2">OUTPUT</text>

  <g font-family="monospace" font-size="15" fill="#6d635e" letter-spacing="3">
    <text x="80" y="740">SPLIT UNEVEN</text>
    <text x="500" y="740">RECOVERS ON FAILURE</text>
  </g>
</svg>
