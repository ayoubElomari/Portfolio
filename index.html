<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- `media="print"` + `onload` swap keeps these off the critical
         rendering path without losing the early fetch a plain <link
         rel="stylesheet"> gives — the `display=swap` in each URL means text
         stays visible on the system-font fallback until each swap fires.
         The <noscript> block covers requests with JS disabled. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Default title/description. Individual routes override the title (and
         where useful the description) at runtime via `src/lib/usePageMeta.js`,
         so these are what a crawler without JS and the initial paint see. -->
    <title>Ayoub El Omari, Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Ayoub El Omari: a student full-stack developer building systems that run on their own, plus the interfaces and automation around them. Open to part-time work."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ayoub El Omari" />
    <meta property="og:title" content="Ayoub El Omari, Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Ayoub El Omari: a student full-stack developer building systems that run on their own, plus the interfaces and automation around them. Open to part-time work."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ayoub El Omari, Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ayoub El Omari: a student full-stack developer building systems that run on their own, plus the interfaces and automation around them. Open to part-time work."
    />
    <meta property="og:url" content="https://www.ayoubelomari.online/" />
    <meta property="og:image" content="https://www.ayoubelomari.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://www.ayoubelomari.online/og-image.png" />
    <!-- No canonical link on purpose: the site stays unlisted (`noindex`
         above), so there is nothing for a canonical to consolidate. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
